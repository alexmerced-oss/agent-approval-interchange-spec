[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-approval-interchange"
version = "0.1.0"
description = "Python support library for the Agent Approval Interchange Specification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Merced" }]
keywords = ["agent", "ai", "approval", "human-in-the-loop", "specification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["jsonschema>=4.18", "rfc8785>=0.1.4,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/alexmerced-oss/agent-approval-interchange-spec"
Specification = "https://github.com/alexmerced-oss/agent-approval-interchange-spec/blob/main/spec/v1/SPEC.md"

[project.scripts]
aais-validate = "aais.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aais"]

[tool.hatch.build.targets.wheel.force-include]
"schema/v1/aais-1.0.schema.json" = "aais/schema/aais-1.0.schema.json"

[tool.hatch.build.targets.sdist]
include = ["aais", "schema", "spec", "conformance", "examples", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
